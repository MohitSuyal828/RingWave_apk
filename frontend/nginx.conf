server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the usual text-based assets — the built JS bundle is the biggest
    # win here (~750KB uncompressed per the last build output).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Client-side routing (React Router): any path that isn't a real static
    # file falls back to index.html so the SPA's own router can handle it.
    # Without this, refreshing on e.g. /contacts or /calls/history would
    # 404 at the nginx layer instead of reaching the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (dist/assets/*-[hash].js/css) are safe to cache
    # aggressively forever — a new deploy produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached the same way — it's what
    # points at the current hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# ── Render Blueprint ────────────────────────────────────────────────────────
#
# Deploys the backend, the AI service, and a managed Postgres instance.
# The frontend is NOT included here — see vercel.json in frontend/ for that
# (Vercel is the more natural fit for a static Vite SPA than Render's web
# service product, though Render's own static-site hosting would work too
# if you'd rather keep everything on one platform).
#
# Usage: push this repo to GitHub/GitLab, then in the Render dashboard use
# "New +" -> "Blueprint" and point it at this repo. Render reads this file
# and provisions all three resources together.
#
# Secrets (JWT_SECRET) are intentionally left as `sync: false` — Render
# will prompt you to enter them in the dashboard rather than committing
# them to this file.
databases:
  - name: ringwave-db
    plan: free
    databaseName: ringwave_db
    user: ringwave

services:
  - type: web
    name: ringwave-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ringwave-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN_DAYS
        value: "7"
      - key: PASSWORD_RESET_EXPIRES_IN_MINUTES
        value: "15"
      # Set to your actual deployed frontend URL once you have it (used
      # only to build the link in password-reset emails).
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      # Comma-separated list — MUST be set explicitly in production
      # (see backend/.env.example for why the local-dev fallback doesn't
      # apply here).
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: LOG_LEVEL
        value: info
      # Render sets PORT automatically; server.js reads it directly.

  - type: web
    name: ringwave-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      # Must be the exact same value as ringwave-backend's JWT_SECRET —
      # this service verifies the same access tokens the Node backend
      # issues.
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: ringwave-api
      - key: AI_SERVICE_ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: AI_SERVICE_MODEL_DEVICE
        value: cpu
      - key: AI_SERVICE_TAU1
        value: "0.12"
      - key: AI_SERVICE_TAU2
        value: "0.95"
      - key: AI_SERVICE_USE_VAD
        value: "true"
      # Render sets PORT automatically; the Dockerfile's CMD reads it
      # directly (falls back to AI_SERVICE_PORT, then 8000, if unset).
